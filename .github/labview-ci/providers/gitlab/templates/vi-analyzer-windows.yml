lvci:vi-analyzer-windows:
  extends: .lvci:windows-docker
  stage: verify
  needs:
    - job: lvci:worker-windows
      optional: true
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: manual
      allow_failure: true
    - changes:
        - "**/*.vi"
        - "**/*.ctl"
        - "**/*.lvproj"
        - "**/*.lvlib"
        - "**/*.lvclass"
        - "**/*.viancfg"
  script:
    - |
      $ErrorActionPreference = 'Continue'
      $reportDir = Join-Path $env:CI_PROJECT_DIR 'ci-out\vi-analyzer'
      New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
      if ($env:LVCI_WINDOWS_IMAGE) {
        $image = $env:LVCI_WINDOWS_IMAGE
      } elseif ($env:LVCI_USE_CUSTOM_IMAGE -eq 'true') {
        $image = "$env:CI_REGISTRY_IMAGE/labview:windows-latest"
      } else {
        $image = 'nationalinstruments/labview:latest-windows'
      }
      if ($image.StartsWith("$env:CI_REGISTRY_IMAGE/", [System.StringComparison]::OrdinalIgnoreCase)) {
        $env:CI_REGISTRY_PASSWORD | docker login $env:CI_REGISTRY --username $env:CI_REGISTRY_USER --password-stdin
      }
      docker pull $image
      $pullExit = $LASTEXITCODE
      $analyzeExit = 1
      if ($pullExit -eq 0) {
        docker run --rm `
          -e "GITHUB_REPOSITORY=$env:CI_PROJECT_PATH" `
          -e "GITHUB_SHA=$env:CI_COMMIT_SHA" `
          -v "$($env:CI_PROJECT_DIR):C:\workspace" `
          $image `
          powershell -NonInteractive -ExecutionPolicy Bypass `
            -File 'C:\workspace\.github\labview\run-vi-analyzer.ps1' `
            -WorkspaceRoot 'C:\workspace' `
            -ReportDir 'C:\workspace\ci-out\vi-analyzer' `
            -LabVIEWPath "C:\Program Files\National Instruments\LabVIEW $env:LVCI_LABVIEW_VERSION\LabVIEW.exe"
        $analyzeExit = $LASTEXITCODE
      } else {
        Set-Content -Path (Join-Path $reportDir 'vi-analyzer.log') -Value "Could not pull LabVIEW image $image"
      }
      if (Test-Path (Join-Path $reportDir 'passes\manifest.json')) {
        python .github\labview\build-analyzer-report.py `
          --passes-dir (Join-Path $reportDir 'passes') `
          --out $reportDir `
          --pages-base '../..' `
          --sha $env:CI_COMMIT_SHA `
          --platform windows `
          --repo $env:CI_PROJECT_PATH `
          --pages-url $env:CI_PAGES_URL `
          --commit-msg (git log -1 --pretty=%s $env:CI_COMMIT_SHA) `
          --author (git log -1 --pretty=%an $env:CI_COMMIT_SHA) `
          --date (git log -1 --pretty=%cI $env:CI_COMMIT_SHA)
      } elseif (Test-Path (Join-Path $reportDir 'index.html')) {
        python .github\labview\build-analyzer-report.py `
          --in (Join-Path $reportDir 'index.html') `
          --out $reportDir `
          --pages-base '../..' `
          --sha $env:CI_COMMIT_SHA `
          --platform windows `
          --repo $env:CI_PROJECT_PATH `
          --pages-url $env:CI_PAGES_URL `
          --commit-msg (git log -1 --pretty=%s $env:CI_COMMIT_SHA) `
          --author (git log -1 --pretty=%an $env:CI_COMMIT_SHA) `
          --date (git log -1 --pretty=%cI $env:CI_COMMIT_SHA)
      }
      python .gitlab\labview-ci\scripts\stage-report.py `
        --source $reportDir `
        --destination "vi-analyzer/$env:CI_COMMIT_SHA" `
        --fallback 'VI Analyzer did not produce a report. See the GitLab job log.'
      $ErrorActionPreference = 'Stop'
      exit $analyzeExit
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - ci-out/vi-analyzer/
      - ci-out/gitlab-pages/vi-analyzer/$CI_COMMIT_SHA/