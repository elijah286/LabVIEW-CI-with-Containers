lvci:snapshots-2-windows:
  extends: .lvci:windows-docker
  stage: verify
  needs:
    - job: lvci:worker-windows
      optional: true
      artifacts: false
    - job: lvci:snapshots-windows
      optional: true
      artifacts: true
  variables:
    GIT_DEPTH: "0"
  resource_group: labview-ci-snapshot-render
  timeout: 3h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - changes:
        - "**/*.vi"
        - "**/*.ctl"
        - "**/*.lvproj"
        - "**/*.lvlib"
        - "**/*.lvclass"
  script:
    - |
      $ErrorActionPreference = 'Continue'
      $previous = Join-Path $env:CI_PROJECT_DIR '.lvci-previous-pages'
      $workRoot = Join-Path $env:CI_PROJECT_DIR '.lvci-toimages-windows'
      $targetDir = Join-Path $workRoot 'target'
      $binaryDir = Join-Path $workRoot 'bin'
      $renderOut = Join-Path $workRoot 'out'
      $workList = Join-Path $renderOut 'worklist.tsv'
      Remove-Item -Path $workRoot -Recurse -Force -ErrorAction SilentlyContinue
      New-Item -ItemType Directory -Force -Path $targetDir, $binaryDir, (Join-Path $renderOut 'by-blob') | Out-Null
      python .gitlab\labview-ci\scripts\restore-pages.py --out $previous

      function Copy-WindowsFrames([string]$sourceRoot) {
        if (-not (Test-Path $sourceRoot)) { return }
        Get-ChildItem -Path $sourceRoot -Recurse -File -Filter '*.windows.json' | ForEach-Object {
          $relative = $_.FullName.Substring($sourceRoot.Length).TrimStart('\\')
          $destination = Join-Path (Join-Path $renderOut 'by-blob') $relative
          New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
          Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
        }
      }
      Copy-WindowsFrames (Join-Path $previous 'public\vi-snapshots\by-blob')
      Copy-WindowsFrames (Join-Path $env:CI_PROJECT_DIR 'ci-out\gitlab-pages\snapshots-classic\vi-snapshots\by-blob')

      $targetSha = if ($env:LVCI_SNAPSHOT_TARGET_SHA) { $env:LVCI_SNAPSHOT_TARGET_SHA } else { $env:CI_COMMIT_SHA }
      $archive = Join-Path $workRoot 'target.zip'
      git archive --format=zip --output $archive $targetSha
      if ($LASTEXITCODE -eq 0) { Expand-Archive -Path $archive -DestinationPath $targetDir -Force }
      $existing = New-Object 'System.Collections.Generic.HashSet[string]'
      Get-ChildItem -Path (Join-Path $renderOut 'by-blob') -Recurse -File -Filter '*.windows.json' | ForEach-Object {
        [void]$existing.Add(($_.Name -replace '\.windows\.json$', ''))
      }
      $entries = New-Object System.Collections.Generic.List[string]
      foreach ($line in (& git ls-tree -r $targetSha -- '*.vi' '*.ctl')) {
        $pair = $line -split "`t", 2
        if ($pair.Count -ne 2 -or $pair[1] -match '^(\.github|ci-out|build)/') { continue }
        $meta = $pair[0] -split '\s+'
        if ($meta.Count -lt 3 -or $existing.Contains($meta[2])) { continue }
        [void]$entries.Add("$($meta[2])`t$($pair[1])")
      }
      $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
      [System.IO.File]::WriteAllLines($workList, [string[]]$entries, $utf8NoBom)

      $renderExit = 0
      if ($entries.Count -gt 0) {
        $go = Get-Command go -ErrorAction SilentlyContinue
        if (-not $go) {
          $version = ((Select-String -Path '.github\labview\toimages\go.mod' -Pattern '^go\s+(.+)$').Matches | Select-Object -First 1).Groups[1].Value
          $goZip = Join-Path $workRoot 'go.zip'
          $goRoot = Join-Path $workRoot 'go'
          Invoke-WebRequest -UseBasicParsing -Uri "https://go.dev/dl/go$version.windows-amd64.zip" -OutFile $goZip
          Expand-Archive -Path $goZip -DestinationPath $goRoot -Force
          $env:Path = "$(Join-Path $goRoot 'go\bin');$env:Path"
          $go = Get-Command go -ErrorAction SilentlyContinue
        }
        if (-not $go) {
          Set-Content -Path (Join-Path $renderOut 'render.log') -Value 'Go was unavailable; the Windows in-place renderer could not be built.'
          $renderExit = 1
        } else {
          $visDir = Join-Path $env:CI_PROJECT_DIR '.github\labview\toimages\_ni\labview\lvctl\vis'
          $zipPath = Join-Path $visDir 'toimages.zip'
          Remove-Item -Path $zipPath -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $visDir 'toimages') -DestinationPath $zipPath -Force
          Push-Location (Join-Path $env:CI_PROJECT_DIR '.github\labview\toimages\_ni\labview\lvctl')
          & $go.Source build -trimpath -o (Join-Path $binaryDir 'lvctl.exe') .
          $renderExit = $LASTEXITCODE
          Pop-Location
          if ($renderExit -eq 0) {
            Push-Location (Join-Path $env:CI_PROJECT_DIR '.github\labview\toimages')
            & $go.Source build -trimpath -o (Join-Path $binaryDir 'runner.exe') .
            $renderExit = $LASTEXITCODE
            Pop-Location
          }
        }
      }
      if ($env:LVCI_WINDOWS_IMAGE) {
        $image = $env:LVCI_WINDOWS_IMAGE
      } elseif ($env:LVCI_USE_CUSTOM_IMAGE -eq 'true') {
        $image = "$env:CI_REGISTRY_IMAGE/labview:windows-latest"
      } else {
        $image = 'nationalinstruments/labview:latest-windows'
      }
      if ($renderExit -eq 0 -and $entries.Count -gt 0) {
        if ($image.StartsWith("$env:CI_REGISTRY_IMAGE/", [System.StringComparison]::OrdinalIgnoreCase)) {
          $env:CI_REGISTRY_PASSWORD | docker login $env:CI_REGISTRY --username $env:CI_REGISTRY_USER --password-stdin
        }
        docker pull $image
        $renderExit = $LASTEXITCODE
        if ($renderExit -eq 0) {
          $container = "lvci-toimages-win-$([System.Guid]::NewGuid().ToString('N').Substring(0, 8))"
          docker run -d --name $container -v "$($env:CI_PROJECT_DIR):C:\repo" $image powershell -NoProfile -Command "while (`$true) { Start-Sleep -Seconds 3600 }" | Out-Null
          $renderExit = $LASTEXITCODE
          if ($renderExit -eq 0) {
            try {
              docker exec $container powershell -NoProfile -ExecutionPolicy Bypass `
                -File 'C:\repo\.github\labview\toimages\windows-render.ps1' `
                -Workspace 'C:\repo\.lvci-toimages-windows\target' `
                -Worklist 'C:\repo\.lvci-toimages-windows\out\worklist.tsv' `
                -OutByBlob 'C:\out\by-blob' `
                -Lvctl 'C:\repo\.lvci-toimages-windows\bin\lvctl.exe' `
                -Runner 'C:\repo\.lvci-toimages-windows\bin\runner.exe' `
                -RenderTimeout '5m' `
                -ComReadySeconds 600
              $renderExit = $LASTEXITCODE
              $copyDir = Join-Path $workRoot 'copied-frames'
              Remove-Item -Path $copyDir -Recurse -Force -ErrorAction SilentlyContinue
              docker cp "${container}:C:\out\by-blob" $copyDir
              if (Test-Path $copyDir) {
                Copy-Item -Path (Join-Path $copyDir '*') -Destination (Join-Path $renderOut 'by-blob') -Recurse -Force -ErrorAction SilentlyContinue
              }
            } finally {
              docker rm -f $container | Out-Null
            }
          }
        }
      }
      $blobs = @(Get-ChildItem -Path (Join-Path $renderOut 'by-blob') -Recurse -File -Filter '*.windows.json' | ForEach-Object { $_.Name -replace '\.windows\.json$', '' } | Sort-Object -Unique)
      $indexPath = Join-Path $renderOut 'json-blobs.windows.json'
      if ($blobs.Count -eq 0) { Set-Content -Path $indexPath -Value '[]' -Encoding utf8 }
      else { [System.IO.File]::WriteAllText($indexPath, ($blobs | ConvertTo-Json -Compress), $utf8NoBom) }
      python .gitlab\labview-ci\scripts\stage-tree.py `
        --source $renderOut `
        --destination 'ci-out/gitlab-pages/snapshots-2-windows/vi-snapshots'
      $ErrorActionPreference = 'Stop'
      exit $renderExit
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .lvci-toimages-windows/out/
      - ci-out/gitlab-pages/snapshots-2-windows/