lvci:builds-windows:
  extends: .lvci:windows-docker
  stage: verify
  needs:
    - job: lvci:worker-windows
      optional: true
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: manual
      allow_failure: true
    - changes:
        - "**/*.vi"
        - "**/*.ctl"
        - "**/*.lvproj"
        - "**/*.lvlib"
        - "**/*.lvclass"
  script:
    - |
      $ErrorActionPreference = 'Continue'
      $reportDir = Join-Path $env:CI_PROJECT_DIR 'ci-out\builds'
      New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
      if ($env:LVCI_WINDOWS_IMAGE) {
        $image = $env:LVCI_WINDOWS_IMAGE
      } elseif ($env:LVCI_USE_CUSTOM_IMAGE -eq 'true') {
        $image = "$env:CI_REGISTRY_IMAGE/labview:windows-latest"
      } else {
        $image = 'nationalinstruments/labview:latest-windows'
      }
      if ($image.StartsWith("$env:CI_REGISTRY_IMAGE/", [System.StringComparison]::OrdinalIgnoreCase)) {
        $env:CI_REGISTRY_PASSWORD | docker login $env:CI_REGISTRY --username $env:CI_REGISTRY_USER --password-stdin
      }
      docker pull $image
      $pullExit = $LASTEXITCODE
      $buildExit = 1
      if ($pullExit -eq 0) {
        docker run --rm `
          -e "GITHUB_REPOSITORY=$env:CI_PROJECT_PATH" `
          -e "GITHUB_SHA=$env:CI_COMMIT_SHA" `
          -e "GITHUB_REF=$env:CI_COMMIT_REF_NAME" `
          -v "$($env:CI_PROJECT_DIR):C:\workspace" `
          $image `
          powershell -NonInteractive -ExecutionPolicy Bypass `
            -File 'C:\workspace\.github\labview\build-binaries.ps1' `
            -WorkspaceRoot 'C:\workspace' `
            -ReportDir 'C:\workspace\ci-out\builds' `
            -LabVIEWPath "C:\Program Files\National Instruments\LabVIEW $env:LVCI_LABVIEW_VERSION\LabVIEW.exe"
        $buildExit = $LASTEXITCODE
      } else {
        Set-Content -Path (Join-Path $reportDir 'builds.log') -Value "Could not pull LabVIEW image $image"
      }
      python .github\labview\build-binaries-report.py `
        --summary (Join-Path $reportDir 'summary.json') `
        --out $reportDir `
        --platform windows `
        --sha $env:CI_COMMIT_SHA `
        --repo $env:CI_PROJECT_PATH `
        --pages-url $env:CI_PAGES_URL `
        --labview-version $env:LVCI_LABVIEW_VERSION `
        --run-url $env:CI_PIPELINE_URL `
        --commit-msg (git log -1 --pretty=%s $env:CI_COMMIT_SHA) `
        --author (git log -1 --pretty=%an $env:CI_COMMIT_SHA) `
        --date (git log -1 --pretty=%cI $env:CI_COMMIT_SHA)
      python .gitlab\labview-ci\scripts\stage-report.py `
        --source $reportDir `
        --destination "builds/$env:CI_COMMIT_SHA" `
        --fallback 'Build specifications did not produce a report. See the GitLab job log.'
      $ErrorActionPreference = 'Stop'
      exit $buildExit
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - ci-out/builds/
      - ci-out/gitlab-pages/builds/$CI_COMMIT_SHA/