lvci:masscompile-linux:
  extends: .lvci:linux-docker
  stage: verify
  needs:
    - job: lvci:worker-linux
      optional: true
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: manual
      allow_failure: true
    - changes:
        - "**/*.vi"
        - "**/*.ctl"
        - "**/*.lvproj"
        - "**/*.lvlib"
        - "**/*.lvclass"
  script:
    - |
      set +e
      report_dir="ci-out/masscompile"
      mkdir -p "$report_dir"
      if [ -n "${LVCI_LINUX_IMAGE:-}" ]; then
        image="${LVCI_LINUX_IMAGE:-nationalinstruments/labview:latest-linux}"
      elif [ "${LVCI_USE_CUSTOM_IMAGE:-false}" = "true" ]; then
        image="${CI_REGISTRY_IMAGE}/labview:linux-latest"
      else
        image="nationalinstruments/labview:latest-linux"
      fi
      if [[ "$image" == "${CI_REGISTRY_IMAGE}"/* ]]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
      fi
      docker pull "$image"
      pull_exit=$?
      compile_exit=1
      if [ "$pull_exit" -eq 0 ]; then
        docker run --rm \
          -e "GITHUB_REPOSITORY=$CI_PROJECT_PATH" \
          -e "GITHUB_SHA=$CI_COMMIT_SHA" \
          -v "$CI_PROJECT_DIR:/workspace" \
          "$image" \
          bash /workspace/.github/labview/masscompile.sh /workspace "/workspace/$report_dir"
        compile_exit=$?
      else
        printf 'Could not pull LabVIEW image %s\n' "$image" > "$report_dir/masscompile.log"
        printf '{"platform":"linux","status":"failed","exit":1,"duration":0}\n' > "$report_dir/compile-meta.json"
      fi
      python3 .github/labview/build-masscompile-report.py \
        --log "$report_dir/masscompile.log" \
        --workspace "$CI_PROJECT_DIR" \
        --out "$report_dir" \
        --platform linux \
        --meta "$report_dir/compile-meta.json" \
        --sha "$CI_COMMIT_SHA" \
        --repo "$CI_PROJECT_PATH" \
        --pages-url "$CI_PAGES_URL" \
        --labview-version "$LVCI_LABVIEW_VERSION" \
        --commit-msg "$(git log -1 --pretty=%s "$CI_COMMIT_SHA")" \
        --author "$(git log -1 --pretty=%an "$CI_COMMIT_SHA")" \
        --date "$(git log -1 --pretty=%cI "$CI_COMMIT_SHA")" || true
      if [ ! -f "$report_dir/index.html" ]; then
        printf '<!doctype html><title>Mass Compile</title><pre>Mass Compile did not produce a report. See the GitLab job log.</pre>\n' > "$report_dir/index.html"
      fi
      python3 .gitlab/labview-ci/scripts/stage-report.py \
        --source "$report_dir" \
        --destination "masscompile/$CI_COMMIT_SHA/linux"
      exit "$compile_exit"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - ci-out/masscompile/
      - ci-out/gitlab-pages/masscompile/$CI_COMMIT_SHA/linux/